name: Folderpad
options:
  bundleIdPrefix: com.falconsw
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
targets:
  Folderpad:
    type: application
    platform: macOS
    sources:
      - path: Folderpad
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: Folderpad
        PRODUCT_BUNDLE_IDENTIFIER: com.falconsw.folderpad
        INFOPLIST_FILE: Folderpad/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
  FolderpadTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/FolderpadTests
    dependencies:
      - target: Folderpad
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
schemes:
  Folderpad:
    build:
      targets:
        Folderpad: all
    test:
      targets:
        - FolderpadTests
